[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "permainfer"
version = "0.1.0"
description = "Open-weight inference with verifiable receipts anchored to Arweave"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "llama-cpp-python==0.3.16",
  "httpx>=0.27",
  "cryptography>=42",
  "pydantic>=2.0",
]

[project.scripts]
permainfer = "permainfer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
